<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhishek Satpute · Android Developer</title>
    <meta name="description" content="Abhishek Satpute — Android developer building and shipping apps on Google Play as ROAA: PlayBox, Klef Password Manager and Expense Tracker.">
    <meta property="og:title" content="Abhishek Satpute · Android Developer">
    <meta property="og:description" content="Apps on Google Play, websites and open-source work — built with Kotlin.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#F7F4EC">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314213D'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='28' text-anchor='middle' fill='%23FFCE3A'%3EAS%3C/text%3E%3C/svg%3E">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loader" aria-label="Loading">
        <div class="shapes">
            <span class="circle"></span>
            <span class="square"></span>
            <span class="triangle"></span>
        </div>
        <p>Abhishek Satpute</p>
    </div>
    <script>
        // Hide the loader once Compose has mounted its viewport.
        new MutationObserver((mutations, observer) => {
            const mounted = mutations.some(m => [...m.addedNodes].some(n =>
                n.nodeType === 1 && !["SCRIPT", "STYLE", "LINK"].includes(n.nodeName) && n.id !== "loader"));
            if (mounted) {
                setTimeout(() => document.getElementById("loader")?.remove(), 350);
                observer.disconnect();
            }
        }).observe(document.body, { childList: true, subtree: true });
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
